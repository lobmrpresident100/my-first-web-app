<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <article class="card">
    <img 
      src="./assets/images/illustration-article.svg" 
      alt="Abstract illustration with HTML and CSS code brackets" 
      class="card-image"
    >
    
    <span class="tag">Learning</span>
    
    <p class="date">Published 21 Dec 2023</p>
    
    <h1 class="title">
      <a href="#">HTML & CSS foundations</a>
    </h1>
    
    <p class="description">
      These languages are the backbone of every website, defining structure, content, and presentation.
    </p>
    
    <div class="author">
      <img 
        src="./assets/images/image-avatar.webp" 
        alt="Greg Hooper" 
        class="author-avatar"
      >
      <span class="author-name">Greg Hooper</span>
    </div>
  </article>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">IMOABASI JAMES</a>.
  </footer>

</body>
</html>
